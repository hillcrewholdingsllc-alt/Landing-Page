name: One-time enhance KREI site photos

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enhance-krei-images.yml

permissions:
  contents: write

jobs:
  enhance-images:
    if: github.event.head_commit.message == 'Run one-time KREI image enhancement'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Upscale and sharpen existing KREI photos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageEnhance

          files = [
              Path('assets/addison-client-closing.webp'),
              Path('assets/addison-ecu-community.webp'),
              Path('assets/addison-hill-founder.webp'),
              Path('assets/addison-local-sellers.webp'),
              Path('assets/addison-seller-home.webp'),
          ]

          for path in files:
              im = Image.open(path).convert('RGB')
              up = im.resize((im.width * 2, im.height * 2), Image.Resampling.LANCZOS)
              up = up.filter(ImageFilter.UnsharpMask(radius=1.25, percent=145, threshold=3))
              up = ImageEnhance.Contrast(up).enhance(1.03)
              up.save(path, 'WEBP', quality=92, method=6)
              print(f'{path}: {im.width}x{im.height} -> {up.width}x{up.height}')
          PY

      - name: Commit enhanced assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/addison-client-closing.webp \
                  assets/addison-ecu-community.webp \
                  assets/addison-hill-founder.webp \
                  assets/addison-local-sellers.webp \
                  assets/addison-seller-home.webp
          if git diff --cached --quiet; then
            echo 'No image changes detected.'
            exit 0
          fi
          git commit -m 'Enhance KREI site photos for high-DPI displays'
          git push origin HEAD:main
