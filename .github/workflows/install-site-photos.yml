name: Install KREI site photos

on:
  push:
    paths:
      - '.staging/**'
      - '.github/workflows/install-site-photos.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode optimized site photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          for f in .staging/*.b64; do
            [ -e "$f" ] || continue
            name="$(basename "$f" .b64)"
            base64 --decode "$f" > "assets/${name}.webp"
          done
          if [ -f .staging/addison-local-sellers.part1 ] && [ -f .staging/addison-local-sellers.part2 ]; then
            cat .staging/addison-local-sellers.part1 .staging/addison-local-sellers.part2 | base64 --decode > assets/addison-local-sellers.webp
          fi
          for img in assets/addison-*.webp; do
            test -s "$img"
            file "$img" | grep -qi 'Web/P image'
          done
      - name: Commit binary assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/addison-*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add KREI founder and local trust photos"
          git push
