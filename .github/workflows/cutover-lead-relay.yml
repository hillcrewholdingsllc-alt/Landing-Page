name: Cut over lead form to Cloudflare relay
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace n8n form action with Cloudflare Worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'https://n8n.hcautomations.fyi/webhook/7f671b06-1d6d-479f-8109-e12541982ce0/website-lead'
          new = 'https://kbuyhouses-lead-relay.hillcrew-automations.workers.dev/lead'
          if old in s:
              p.write_text(s.replace(old, new))
          PY
      - name: Commit cutover if needed
        run: |
          if git diff --quiet; then
            echo 'No cutover needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Point seller lead form to Cloudflare Worker relay'
          git push
