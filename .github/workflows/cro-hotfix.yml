name: CRO hotfix and image optimization
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cro-hotfix.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CRO markup and mobile presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=s.replace('323 Clifton St Ste 12, Greenville, NC 27858 · <a href="tel:+12523593197">(252) 359-3197</a></p></div><section class="section" style="background:#e9efea">','323 Clifton St Ste 12, Greenville, NC 27858 · <a href="tel:+12523593197">(252) 359-3197</a></p></div></section><section class="section" style="background:#e9efea">')
          s=re.sub(r'<div class="row"><div class="field"><label for="first-name">First name</label><input id="first-name" name="firstName" required autocomplete="given-name"></div><div class="field"><label for="last-name">Last name</label><input id="last-name" name="lastName" autocomplete="family-name"></div></div>', '<div class="field"><label for="first-name">First name</label><input id="first-name" name="firstName" required autocomplete="given-name"></div>', s)
          s=s.replace('<div class="row"><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" required autocomplete="tel"></div></div>', '<div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" required autocomplete="tel"></div>')
          p.write_text(s)
          p=Path('lp/greenville-cash-offer.html'); s=p.read_text()
          if '.mobile-pitch{display:block!important}' not in s:
              s=s.replace('</style>', '@media(max-width:860px){.mobile-pitch{display:block!important}}\n</style>')
          p.write_text(s)
          PY
      - name: Compress homepage hero
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('krei-homepage-hero.webp')
          im=Image.open(p).convert('RGB')
          if im.width>1200:
              h=round(im.height*1200/im.width)
              im=im.resize((1200,h), Image.Resampling.LANCZOS)
          im.save(p,'WEBP',quality=78,method=6)
          print('hero bytes',p.stat().st_size)
          PY
      - name: Commit hotfix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html lp/greenville-cash-offer.html krei-homepage-hero.webp
          git commit -m 'Fix CRO markup and optimize homepage hero'
          git push
