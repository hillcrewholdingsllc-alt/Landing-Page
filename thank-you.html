<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#244A3A" />
  <title>Thanks — We Received Your Property | K Real Estate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <script>
    (function(){
      var params=new URLSearchParams(location.hash.slice(1));
      var submission=params.get('submission'),receipt=params.get('receipt');
      if(receipt)history.replaceState(null,'',location.pathname+location.search);
      window.addEventListener('load',async function(){
        if(!submission||!receipt||typeof window.kreiTrack!=='function')return;
        try{
          var response=await fetch('https://kbuyhouses-lead-relay.hillcrew-automations.workers.dev/conversion-receipt',{
            method:'POST',headers:{'Content-Type':'application/json'},credentials:'omit',cache:'no-store',
            body:JSON.stringify({submissionId:submission,receipt:receipt})
          });
          if(!response.ok)return;
          var result=await response.json();
          if(result.ok===true&&result.submissionId===submission&&/^[0-9a-f-]{36}$/i.test(result.conversionId||'')){
            window.kreiTrack('generate_lead',{form_name:'seller_lead',conversion_source:'verified_queue_receipt',submission_id:result.conversionId});
          }
        }catch(_e){/* A failed receipt check must never become a lead conversion. */}
      });
    })();
  </script>
  <script src="/analytics.js?v=20260906-receipt" defer></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:#F7F3EB;color:#272B28;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);background:white;border:1px solid #E3E7E1;border-radius:30px;padding:52px 36px;text-align:center;box-shadow:0 20px 55px rgba(36,74,58,.10)}.mark{width:64px;height:64px;border-radius:50%;background:#244A3A;color:#fff;display:grid;place-items:center;margin:0 auto 22px;font-size:30px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:#4F6F5D}.title{font-family:'Playfair Display',serif;color:#173D2E;font-size:clamp(36px,7vw,54px);line-height:1.05;margin:12px 0 18px}.copy{color:#68736C;font-size:18px;line-height:1.65;max-width:560px;margin:0 auto}.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:14px 22px;text-decoration:none;font-weight:700}.primary{background:#244A3A;color:#fff}.secondary{border:1px solid #C9D3CA;color:#244A3A;background:#fff}@media(max-width:600px){.card{padding:40px 22px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✓</div>
    <div class="eyebrow">Property request received</div>
    <h1 class="title">Thanks. We’ve got your information.</h1>
    <p class="copy">Someone from K Real Estate will review the property details and follow up with you shortly. If your situation is time-sensitive, you can call us directly.</p>
    <div class="actions">
      <a class="btn primary" href="tel:+12523593197">Call (252) 359-3197</a>
      <a class="btn secondary" href="/">Back to Kbuyhouses.com</a>
    </div>
  </main>
</body>
</html>
