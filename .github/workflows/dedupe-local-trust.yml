name: Dedupe local trust sections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dedupe-local-trust.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate trust blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          s = re.sub(r'<style>\s*\.local-about\{.*?</style>', '', s, count=1, flags=re.S)
          s = re.sub(r'<section class="section local-about" id="about-local-buyer">.*?</section>', '', s, count=1, flags=re.S)
          s = s.replace('Professional portrait of Addison Hill of K Real Estate &amp; Investment LLC', 'Professional portrait for K Real Estate &amp; Investment LLC')
          s = s.replace('K Real Estate principal at an East Carolina University community event', 'K Real Estate representative at a Greenville community event')
          p.write_text(s)

          p = Path('lp/greenville-cash-offer.html')
          s = p.read_text()
          css = """\n  .local-human-proof{padding:44px 0;background:#fff}.human-proof-grid{display:grid;grid-template-columns:.72fr 1.28fr;gap:28px;align-items:center}.human-proof-grid>img{width:100%;height:300px;object-fit:cover;border-radius:22px}.human-proof-grid h2{font:700 clamp(30px,4vw,42px)/1.08 'Playfair Display',serif;color:#173d2e;margin:8px 0 12px}.human-proof-grid p{color:#68736c;line-height:1.65}.mini-founder{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:13px;font-weight:700;color:#3f4a44}.mini-founder img{width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:center 18%}@media(max-width:700px){.human-proof-grid{grid-template-columns:1fr}.human-proof-grid>img{height:260px}}\n"""
          s = s.replace(css, '')
          s = re.sub(r'<section class="local-human-proof">.*?</section>', '', s, count=1, flags=re.S)
          s = s.replace('Professional portrait of Addison Hill of K Real Estate &amp; Investment LLC', 'Professional portrait for K Real Estate &amp; Investment LLC')
          p.write_text(s)
          PY
      - name: Commit deduplication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html lp/greenville-cash-offer.html
          if git diff --cached --quiet; then
            echo 'No duplicate blocks found'
            exit 0
          fi
          git commit -m 'Remove duplicate local trust sections'
          git push
